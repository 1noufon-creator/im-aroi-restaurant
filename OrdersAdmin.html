<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>จัดการคำสั่งซื้อ - ร้านอิ่มอร่อย</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* =========================
   HEADER
========================= */

.header {
    background: #222;
    color: white;
    padding: 15px 22px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.header-btn {
    background: #333;
    color: white;

    border: 1px solid #666;

    border-radius: 8px;

    padding: 9px 13px;

    cursor: pointer;
}

/* =========================
   CONTAINER
========================= */

.container {
    max-width: 1200px;
    margin: 22px auto;
    padding: 0 15px;
}

.title-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;
}

.title-row h1 {
    margin: 0;
    font-size: 28px;
}

.title-row p {
    margin: 5px 0 0;
    color: #666;
}

.refresh-btn {

    background: #222;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 10px 15px;

    cursor: pointer;
}

/* =========================
   STAT
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 14px;

    margin-bottom: 18px;
}

.stat {

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 17px;
}

.stat-label {

    font-size: 14px;

    color: #666;
}

.stat-number {

    font-size: 28px;

    font-weight: bold;

    margin-top: 6px;
}

/* =========================
   FILTER
========================= */

.filters {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 13px;

    margin-bottom: 18px;
}

.filter-btn {

    background: white;

    border: 1px solid #ccc;

    border-radius: 8px;

    padding: 9px 13px;

    cursor: pointer;
}

.filter-btn.active {

    background: #222;

    color: white;

    border-color: #222;
}

/* =========================
   ORDER
========================= */

.order-list {

    display: flex;

    flex-direction: column;

    gap: 14px;
}

.order-card {

    background: white;

    border: 1px solid #ddd;

    border-radius: 12px;

    overflow: hidden;
}

.order-head {

    padding: 15px 18px;

    border-bottom: 1px solid #eee;

    display: flex;

    justify-content: space-between;

    gap: 12px;
}

.order-id {

    font-size: 18px;

    font-weight: bold;
}

.customer {

    margin-top: 5px;

    color: #444;
}

.order-date {

    margin-top: 4px;

    color: #777;

    font-size: 13px;
}

/* =========================
   STATUS
========================= */

.status {

    display: inline-block;

    padding: 6px 11px;

    border-radius: 20px;

    font-size: 13px;

    font-weight: bold;

    white-space: nowrap;
}

.status-new {

    background: #fff3cd;

    color: #664d03;
}

.status-making {

    background: #cfe2ff;

    color: #084298;
}

.status-ready {

    background: #d1e7dd;

    color: #0f5132;
}

.status-done {

    background: #e2e3e5;

    color: #41464b;
}

/* =========================
   ITEMS
========================= */

.order-body {

    padding: 14px 18px;
}

.item {

    display: flex;

    justify-content: space-between;

    gap: 12px;

    padding: 10px 0;

    border-bottom: 1px solid #eee;
}

.item:last-child {

    border-bottom: none;
}

.item-name {

    font-weight: bold;
}

.item-detail {

    font-size: 14px;

    color: #666;

    margin-top: 4px;
}

.item-total {

    font-weight: bold;

    white-space: nowrap;
}

/* =========================
   BOTTOM
========================= */

.order-bottom {

    border-top: 1px solid #eee;

    padding: 14px 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 12px;

    flex-wrap: wrap;
}

.payment {

    font-size: 14px;

    color: #555;

    margin-bottom: 4px;
}

.total {

    font-size: 20px;

    font-weight: bold;
}

.actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.action-btn,
.detail-btn {

    background: white;

    border: 1px solid #ccc;

    border-radius: 8px;

    padding: 9px 12px;

    cursor: pointer;
}

.action-btn.primary {

    background: #222;

    color: white;

    border-color: #222;
}

/* =========================
   DETAIL
========================= */

.detail {

    display: none;

    background: #fafafa;

    border-top: 1px solid #eee;

    padding: 14px 18px;
}

.detail.show {

    display: block;
}

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;

    font-size: 14px;
}

.note {

    background: #fff8e1;

    border: 1px solid #ffe082;

    border-radius: 8px;

    padding: 10px;

    margin-top: 10px;
}

.loading,
.empty {

    text-align: center;

    padding: 45px;

    color: #777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px) {

    .stats {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .title-row {

        align-items: flex-start;

        flex-direction: column;

        gap: 10px;
    }

    .order-head {

        flex-direction: column;
    }

    .info-grid {

        grid-template-columns: 1fr;
    }
}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <div class="logo">
            🍔 ร้านอิ่มอร่อย — จัดการคำสั่งซื้อ
        </div>

        <div class="header-actions">

            <button
                class="header-btn"
                onclick="goDashboard()">

                แดชบอร์ด

            </button>

            <button
                class="header-btn"
                onclick="logout()">

                ออกจากระบบ

            </button>

        </div>

    </div>

</header>



<main class="container">


<!-- =========================
     TITLE
========================= -->

<div class="title-row">

    <div>

        <h1>
            📦 คำสั่งซื้อ
        </h1>

        <p id="adminName">
            กำลังตรวจสอบสิทธิ์...
        </p>

    </div>

<div id="orderNotice"
     style="display:none; padding:12px; margin:12px 0;
            background:#fff3cd; border-radius:8px; font-weight:bold;">
</div>

<button type="button" class="refresh-btn" onclick="enableOrderSound()">
    🔔 เปิดเสียงแจ้งเตือน
</button>


    <button
        class="refresh-btn"
        onclick="loadOrders()">

        🔄 รีเฟรช

    </button>

</div>



<!-- =========================
     STAT
========================= -->

<div class="stats">


    <div class="stat">

        <div class="stat-label">
            ออเดอร์ทั้งหมด
        </div>

        <div
            class="stat-number"
            id="statAll">

            0

        </div>

    </div>



    <div class="stat">

        <div class="stat-label">
            รับออเดอร์แล้ว
        </div>

        <div
            class="stat-number"
            id="statNew">

            0

        </div>

    </div>



    <div class="stat">

        <div class="stat-label">
            กำลังทำ
        </div>

        <div
            class="stat-number"
            id="statMaking">

            0

        </div>

    </div>



    <div class="stat">

        <div class="stat-label">
            พร้อมรับ
        </div>

        <div
            class="stat-number"
            id="statReady">

            0

        </div>

    </div>


</div>



<!-- =========================
     FILTER
========================= -->

<div class="filters">


    <button
        class="filter-btn active"
        onclick="setFilter('ALL',this)">

        ทั้งหมด

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('รับออเดอร์แล้ว',this)">

        รับออเดอร์แล้ว

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('กำลังทำ',this)">

        กำลังทำ

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('พร้อมรับ',this)">

        พร้อมรับ

    </button>


    <button
        class="filter-btn"
        onclick="setFilter('เสร็จสิ้น',this)">

        เสร็จสิ้น

    </button>


</div>



<!-- =========================
     ORDER LIST
========================= -->

<div
    id="loading"
    class="loading">

    กำลังโหลดคำสั่งซื้อ...

</div>


<div
    id="orderList"
    class="order-list"
    style="display:none">

</div>


</main>



<script>


// =====================================================
// API
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbzyjIj7SCD0TFaecm7-BKqu1Q7J2mhhY0DE5wqAaLEfCnayEWTju7MlcH9Nr2VIgvuP/exec";


const token =
    sessionStorage.getItem("loginToken") ||
    localStorage.getItem("loginToken");


let orders = [];

let currentFilter = "ALL";
let knownOrderIds = null;
let pollInProgress = false;
let orderAudioContext = null;

function enableOrderSound() {
    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            alert("เบราว์เซอร์นี้ไม่รองรับเสียงแจ้งเตือน");
            return;
        }

        if (!orderAudioContext) {
            orderAudioContext = new AudioContextClass();
        }

        orderAudioContext.resume().then(() => {
            playOrderSound();
            alert("เปิดเสียงแจ้งเตือนแล้ว");
        });
    } catch (error) {
        alert("เปิดเสียงไม่สำเร็จ กรุณาตรวจสอบการตั้งค่าเสียงของเบราว์เซอร์");
    }
}

function playOrderSound() {
    if (!orderAudioContext ||
        orderAudioContext.state !== "running") {
        return;
    }

    const oscillator = orderAudioContext.createOscillator();
    const gain = orderAudioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 880;
    gain.gain.value = 0.2;

    oscillator.connect(gain);
    gain.connect(orderAudioContext.destination);

    oscillator.start();

    gain.gain.setValueAtTime(0.2, orderAudioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        orderAudioContext.currentTime + 0.6
    );

    oscillator.stop(orderAudioContext.currentTime + 0.6);
}

function notifyNewOrders(newOrders) {
    if (!newOrders.length) return;

    const notice = document.getElementById("orderNotice");

    notice.style.display = "block";
    notice.textContent =
        "🔔 มีคำสั่งซื้อใหม่ " + newOrders.length + " รายการ!";

    playOrderSound();
}



// =====================================================
// ป้องกัน HTML Injection
// =====================================================

function safe(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}



// =====================================================
// เงิน
// =====================================================

function money(value) {

    return "฿" +
        Number(value || 0)
        .toLocaleString("th-TH", {

            minimumFractionDigits: 2,

            maximumFractionDigits: 2

        });

}



// =====================================================
// สีสถานะ
// =====================================================

function statusClass(status) {

    if (status === "รับออเดอร์แล้ว")
        return "status-new";

    if (status === "กำลังทำ")
        return "status-making";

    if (status === "พร้อมรับ")
        return "status-ready";

    return "status-done";
}



// =====================================================
// ตรวจสอบ Admin
// =====================================================

async function checkAdmin() {


    if (!token) {

        window.location.href =
            "Users.html";

        return;
    }


    try {


        const response = await fetch(

            API_URL,

            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body: JSON.stringify({

                    action: "checkAdmin",

                    token: token

                })

            }

        );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "ไม่มีสิทธิ์เข้าใช้งาน"
            );
        }


        const user =
            result.user || {};


        document.getElementById(
            "adminName"
        ).textContent =
            "ผู้ดูแลระบบ: " +
            (
                user.Name ||
                user.Email ||
                "Admin"
            );


        loadOrders();


    }
    catch (error) {


        sessionStorage.removeItem(
            "loginToken"
        );

        localStorage.removeItem(
            "loginToken"
        );


        alert(
            error.message ||
            "ไม่มีสิทธิ์เข้าใช้งาน"
        );


        window.location.href =
            "Users.html";

    }

}



// =====================================================
// โหลด Orders
// =====================================================

async function loadOrders() {


    const loading =
        document.getElementById(
            "loading"
        );


    const list =
        document.getElementById(
            "orderList"
        );


    loading.style.display =
        "block";


    list.style.display =
        "none";


    try {


        const response =
            await fetch(

                API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                        "text/plain;charset=utf-8"

                    },

                    body: JSON.stringify({

                        action:
                        "getAdminOrders",

                        token:
                        token

                    })

                }

            );
        
const fetchedOrders = Array.isArray(result.orders)
    ? result.orders
    : [];

let newOrders = [];

if (knownOrderIds !== null) {
    newOrders = fetchedOrders.filter(order =>
        order.OrderID &&
        !knownOrderIds.has(String(order.OrderID))
    );
}

knownOrderIds = new Set(
    fetchedOrders
        .filter(order => order.OrderID)
        .map(order => String(order.OrderID))
);

orders = fetchedOrders;

if (newOrders.length > 0) {
    notifyNewOrders(newOrders);
}

updateStats();
renderOrders();



        loading.style.display =
            "none";


        list.style.display =
            "flex";


    }
    catch (error) {


        loading.innerHTML =
            "❌ " +
            safe(error.message) +

            "<br><br>" +

            "<button " +
            "class='refresh-btn' " +
            "onclick='loadOrders()'>" +

            "ลองใหม่" +

            "</button>";

    }

}


function startOrderPolling() {
    setInterval(async () => {
        if (pollInProgress || document.hidden) return;

        pollInProgress = true;

        try {
            await loadOrders(true);
        } finally {
            pollInProgress = false;
        }
    }, 5000);
}


// =====================================================
// สถิติ
// =====================================================

function updateStats() {


    document.getElementById(
        "statAll"
    ).textContent =
        orders.length;


    document.getElementById(
        "statNew"
    ).textContent =
        orders.filter(
            o =>
            o.Status ===
            "รับออเดอร์แล้ว"
        ).length;


    document.getElementById(
        "statMaking"
    ).textContent =
        orders.filter(
            o =>
            o.Status ===
            "กำลังทำ"
        ).length;


    document.getElementById(
        "statReady"
    ).textContent =
        orders.filter(
            o =>
            o.Status ===
            "พร้อมรับ"
        ).length;

}



// =====================================================
// Filter
// =====================================================

function setFilter(
    filter,
    button
) {


    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            btn =>
            btn.classList.remove(
                "active"
            )
        );


    button.classList.add(
        "active"
    );


    renderOrders();

}



// =====================================================
// แสดง Orders
// =====================================================

function renderOrders() {


    const list =
        document.getElementById(
            "orderList"
        );


    const filtered =
        currentFilter === "ALL"

        ? orders

        : orders.filter(
            o =>
            o.Status ===
            currentFilter
        );


    if (!filtered.length) {

        list.innerHTML =

            "<div class='empty'>" +

            "ยังไม่มีคำสั่งซื้อในสถานะนี้" +

            "</div>";

        return;
    }



    list.innerHTML =
        filtered.map(
            (order, index) => {


                const items =
                    Array.isArray(
                        order.Items
                    )
                    ? order.Items
                    : [];


                const payment =
                    order.Payment ||
                    {};



                const itemHTML =
                    items.length

                    ?

                    items.map(
                        item => `

<div class="item">

    <div>

        <div class="item-name">

            ${safe(
                item.ProductName ||
                "สินค้า"
            )}

        </div>


        <div class="item-detail">

            ขนาด
            ${safe(
                item.Size || "-"
            )}

            ×

            ${Number(
                item.Quantity || 0
            )}

            ${
                item.Note

                ?

                " | หมายเหตุ: " +
                safe(item.Note)

                :

                ""
            }

        </div>

    </div>


    <div class="item-total">

        ${money(
            item.ItemTotal
        )}

    </div>

</div>

`
                    ).join("")

                    :

                    "<div class='empty'>" +
                    "ไม่พบรายการสินค้า" +
                    "</div>";



                return `

<div class="order-card">


<!-- HEADER -->

<div class="order-head">

    <div>

        <div class="order-id">

            ${safe(
                order.OrderID ||
                "-"
            )}

        </div>


        <div class="customer">

            👤

            ${safe(
                order.CustomerName ||
                order.UserID ||
                "-"
            )}

        </div>


        ${
            order.CustomerEmail

            ?

            `

<div class="order-date">

    ✉
    ${safe(
        order.CustomerEmail
    )}

</div>

`

            :

            ""
        }


        <div class="order-date">

            🕐

            ${safe(
                order.OrderDate ||
                "-"
            )}

        </div>

    </div>


    <span
        class="status
        ${statusClass(
            order.Status
        )}">

        ${safe(
            order.Status ||
            "-"
        )}

    </span>

</div>



<!-- ITEMS -->

<div class="order-body">

    ${itemHTML}

</div>



<!-- DETAIL -->

<div
    class="detail"
    id="detail-${index}">


    <div class="info-grid">


        <div>

            <b>OrderID:</b>

            ${safe(
                order.OrderID
            )}

        </div>


        <div>

            <b>UserID:</b>

            ${safe(
                order.UserID
            )}

        </div>


        <div>

            <b>วิธีชำระเงิน:</b>

            ${safe(
                payment.Method ||
                "-"
            )}

        </div>


        <div>

            <b>สถานะชำระเงิน:</b>

            ${safe(
                payment.Status ||
                "-"
            )}

        </div>


        <div>

            <b>เวลาทำโดยประมาณ:</b>

            ${safe(
                order.EstimatedMinutes ||
                "-"
            )}

            นาที

        </div>


        <div>

            <b>จำนวนสินค้า:</b>

            ${
                items.reduce(
                    (sum, item) =>
                    sum +
                    Number(
                        item.Quantity || 0
                    ),
                    0
                )
            }

            ชิ้น

        </div>


    </div>



    ${
        order.Note

        ?

        `

<div class="note">

    📝

    หมายเหตุออเดอร์:

    ${safe(
        order.Note
    )}

</div>

`

        :

        ""
    }


</div>



<!-- BOTTOM -->

<div class="order-bottom">


    <div>

        <div class="payment">

            💳

            ${safe(
                payment.Method ||
                "ไม่ระบุ"
            )}

            ${
                payment.Status

                ?

                " | " +
                safe(
                    payment.Status
                )

                :

                ""
            }

        </div>


        <div class="total">

            ${money(
                order.Total
            )}

        </div>

    </div>



    <div class="actions">


        <button
            class="detail-btn"
            onclick="
                toggleDetail(
                    ${index}
                )
            ">

            รายละเอียด

        </button>



        ${
            order.Status ===
            "รับออเดอร์แล้ว"

            ?

            `

<button
    class="action-btn primary"
    onclick="
        changeStatus(
            '${safe(
                order.OrderID
            )}',
            'กำลังทำ'
        )
    ">

    ▶ เริ่มทำ

</button>

`

            :

            ""
        }



        ${
            order.Status ===
            "กำลังทำ"

            ?

            `

<button
    class="action-btn primary"
    onclick="
        changeStatus(
            '${safe(
                order.OrderID
            )}',
            'พร้อมรับ'
        )
    ">

    ✓ พร้อมรับ

</button>

`

            :

            ""
        }



        ${
            order.Status ===
            "พร้อมรับ"

            ?

            `

<button
    class="action-btn primary"
    onclick="
        changeStatus(
            '${safe(
                order.OrderID
            )}',
            'เสร็จสิ้น'
        )
    ">

    ✓ เสร็จสิ้น

</button>

`

            :

            ""
        }


    </div>

</div>


</div>

`;

            }

        ).join("");

}



// =====================================================
// เปิด / ปิดรายละเอียด
// =====================================================

function toggleDetail(index) {


    const element =
        document.getElementById(
            "detail-" +
            index
        );


    if (element) {

        element.classList.toggle(
            "show"
        );

    }

}



// =====================================================
// เปลี่ยนสถานะ
// =====================================================

async function changeStatus(
    orderID,
    status
) {


    const confirmChange =
        confirm(
            "ต้องการเปลี่ยนสถานะเป็น \"" +
            status +
            "\" ใช่หรือไม่?"
        );


    if (!confirmChange) {

        return;
    }



    try {


        const response =
            await fetch(

                API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                        "text/plain;charset=utf-8"

                    },

                    body:
                    JSON.stringify({

                        action:
                        "updateOrderStatus",

                        token:
                        token,

                        OrderID:
                        orderID,

                        Status:
                        status

                    })

                }

            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "เปลี่ยนสถานะไม่สำเร็จ"
            );

        }


        await loadOrders();
        startOrderPolling();


    }
    catch (error) {


        alert(
            error.message ||
            "เกิดข้อผิดพลาด"
        );

    }

}

function logout() {


    sessionStorage.removeItem(
        "loginToken"
    );

    localStorage.removeItem(
        "loginToken"
    );


    sessionStorage.removeItem(
        "currentUser"
    );

    localStorage.removeItem(
        "currentUser"
    );


    window.location.href =
        "Users.html";

}
