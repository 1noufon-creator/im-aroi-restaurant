<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ติดตามคำสั่งซื้อ - ร้านอิ่มอร่อย</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
    background:#f5f5f5;
    color:#222;
}

.header{
    background:#fd4d8d;
    padding:18px 20px;
    box-shadow:0 2px 8px rgba(253, 253, 253, 0.08);
    position:sticky;
    top:0;
    z-index:10;
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    font-size:14px;
}

.btn-menu{
    background:#ffffff;
    color:#fd4d8d;
}

.btn-refresh{
    background:#ffffff;
    color:#fd4d8d;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.title{
    font-size:26px;
    font-weight:bold;
    margin-bottom:5px;
}

.subtitle{
    color:#777;
    margin-bottom:20px;
}

.loading{
    text-align:center;
    background:white;
    padding:35px;
    border-radius:15px;
}

.empty{
    text-align:center;
    background:white;
    padding:40px 20px;
    border-radius:15px;
}

.order-card{
    background:white;
    border-radius:16px;
    margin-bottom:20px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    border-bottom:1px solid #eee;
    padding-bottom:15px;
}

.order-id{
    font-weight:bold;
    font-size:18px;
}

.order-date{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.status{
    padding:8px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
    white-space:nowrap;
}

.status-received{
    background:#fc7db8;
    color:#ffffff;
}

.status-making{
    background:#cfe8ff;
    color:#2a05f8;
}

.status-ready{
    background:#d4edda;
    color:#155724;
}

.status-done{
    background:#e2e3e5;
    color:#383d41;
}

/* Timeline */

.timeline{
    display:flex;
    justify-content:space-between;
    position:relative;
    margin:28px 5px 30px;
}

.timeline::before{
    content:"";
    position:absolute;
    top:17px;
    left:7%;
    right:7%;
    height:4px;
    background:#ddd;
    z-index:0;
}

.step{
    width:25%;
    text-align:center;
    position:relative;
    z-index:1;
}

.circle{
    width:34px;
    height:34px;
    margin:auto;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.step.active .circle{
    background:#222;
    color:white;
}

.step.completed .circle{
    background:#555;
    color:white;
}

.step-text{
    margin-top:8px;
    font-size:12px;
    color:#777;
}

.step.active .step-text,
.step.completed .step-text{
    color:#222;
    font-weight:bold;
}

/* Items */

.section-title{
    font-weight:bold;
    margin:18px 0 10px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.item-name{
    font-weight:bold;
}

.item-detail{
    color:#777;
    font-size:13px;
    margin-top:3px;
}

.item-price{
    white-space:nowrap;
    font-weight:bold;
}

.order-bottom{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.total{
    font-size:20px;
    font-weight:bold;
}

.payment{
    color:#666;
    font-size:14px;
}

/* Mobile */

@media(max-width:600px){

    .header-inner{
        align-items:flex-start;
    }

    .logo{
        font-size:18px;
    }

    .btn{
        padding:8px 10px;
        font-size:12px;
    }

    .title{
        font-size:22px;
    }

    .order-head{
        flex-direction:column;
    }

    .status{
        align-self:flex-start;
    }

    .timeline{
        margin-left:0;
        margin-right:0;
    }

    .timeline::before{
        left:8%;
        right:8%;
    }

    .step-text{
        font-size:10px;
    }

    .circle{
        width:30px;
        height:30px;
        font-size:12px;
    }

    .item{
        font-size:14px;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo">
            🍔 ร้านอิ่มอร่อย
        </div>

        <div class="header-buttons">

            <button
                class="btn btn-menu"
                onclick="goMenu()">
                🍔 เมนู
            </button>

            <button
                class="btn btn-refresh"
                onclick="loadOrders()">
                🔄 รีเฟรช
            </button>

        </div>

    </div>

</header>


<div class="container">

    <div class="title">
        📦 ติดตามคำสั่งซื้อ
    </div>

    <div class="subtitle">
        ตรวจสอบสถานะคำสั่งซื้อของคุณ
    </div>


    <div id="loading" class="loading">
        กำลังโหลดคำสั่งซื้อ...
    </div>


    <div id="ordersContainer"></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzyjIj7SCD0TFaecm7-BKqu1Q7J2mhhY0DE5wqAaLEfCnayEWTju7MlcH9Nr2VIgvuP/exec";


const token =
    sessionStorage.getItem("loginToken") ||
    localStorage.getItem("loginToken");


/* =========================
   ตรวจสอบ Login
========================= */

function checkLogin(){

    if(!token){

        alert("กรุณาเข้าสู่ระบบก่อน");

        window.location.href =
            "Users.html";

        return false;
    }

    return true;
}


/* =========================
   โหลด Orders
========================= */

async function loadOrders(){

    if(!checkLogin()) return;


    const loading =
        document.getElementById("loading");

    const container =
        document.getElementById("ordersContainer");


    loading.style.display = "block";

    container.innerHTML = "";


    try{

        const response =
            await fetch(API_URL,{

                method:"POST",

                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:JSON.stringify({

                    action:"getMyOrders",

                    token:token

                })

            });


        const result =
            await response.json();


        if(!result.success){

            throw new Error(
                result.message ||
                "ไม่สามารถโหลดคำสั่งซื้อได้"
            );

        }


        loading.style.display = "none";


        const orders =
            Array.isArray(result.orders)
            ? result.orders
            : [];


        if(orders.length === 0){

            container.innerHTML = `

                <div class="empty">

                    <div style="font-size:45px;">
                        📦
                    </div>

                    <h3>
                        ยังไม่มีคำสั่งซื้อ
                    </h3>

                    <p style="color:#777;">
                        เลือกเมนูอาหารเพื่อเริ่มสั่งซื้อ
                    </p>

                    <button
                        class="btn btn-refresh"
                        onclick="goMenu()">
                        🍔 ไปที่เมนูอาหาร
                    </button>

                </div>

            `;

            return;
        }


        /*
          เรียงจากรายการล่าสุดก่อน
        */



        container.innerHTML =
            orders.map(order =>
                renderOrder(order)
            ).join("");


    }catch(error){

        console.error(error);

        loading.style.display = "none";

        container.innerHTML = `

            <div class="empty">

                <div style="font-size:40px;">
                    ⚠️
                </div>

                <h3>
                    ไม่สามารถโหลดคำสั่งซื้อได้
                </h3>

                <p style="color:#777;">
                    ${escapeHTML(error.message)}
                </p>

                <button
                    class="btn btn-refresh"
                    onclick="loadOrders()">
                    🔄 ลองใหม่
                </button>

            </div>

        `;

    }

}


/* =========================
   แสดง Order
========================= */

function renderOrder(order){

    const status =
        String(order.Status || "")
        .trim();


    const step =
        getStatusStep(status);


    const statusClass =
        getStatusClass(status);


    const date =
        formatDate(order.OrderDate);


    const items =
        Array.isArray(order.Items)
        ? order.Items
        : [];


    return `

        <div class="order-card">

            <div class="order-head">

                <div>

                    <div class="order-id">
                        📋 ${escapeHTML(order.OrderID || "-")}
                    </div>

                    <div class="order-date">
                        ${escapeHTML(date)}
                    </div>

                </div>


                <div class="status ${statusClass}">
                    ${escapeHTML(status || "-")}
                </div>

            </div>


            ${renderTimeline(step)}


            <div class="section-title">
                🍴 รายการอาหาร
            </div>


            ${
                items.length > 0
                ? items.map(item =>
                    renderItem(item)
                  ).join("")
                : `
                    <div style="color:#777;">
                        ไม่พบรายละเอียดสินค้า
                    </div>
                  `
            }


            <div class="order-bottom">

                <div>

                    <div class="payment">
                        ${escapeHTML(
                            order.ShopName ||
                            "ร้านอิ่มอร่อย"
                        )}
                    </div>

                    ${
                        order.PaymentMethod
                        ? `
                        <div class="payment">
                            ชำระเงิน: ${
                                escapeHTML(
                                    order.PaymentMethod
                                )
                            }
                        </div>
                        `
                        : ""
                    }

                </div>


                <div class="total">

                    ฿${formatMoney(order.Total)}

                </div>

            </div>

        </div>

    `;

}


/* =========================
   Timeline
========================= */

function renderTimeline(currentStep){

    const steps = [

        {
            name:"รับออเดอร์แล้ว",
            icon:"✓"
        },

        {
            name:"กำลังทำ",
            icon:"🍳"
        },

        {
            name:"พร้อมรับ",
            icon:"✓"
        },

        {
            name:"เสร็จสิ้น",
            icon:"✓"
        }

    ];


    return `

        <div class="timeline">

            ${
                steps.map((step,index)=>{

                    let className = "";


                    if(index < currentStep){

                        className =
                            "completed";

                    }else if(index === currentStep){

                        className =
                            "active";

                    }


                    return `

                        <div class="step ${className}">

                            <div class="circle">
                                ${step.icon}
                            </div>

                            <div class="step-text">
                                ${step.name}
                            </div>

                        </div>

                    `;

                }).join("")
            }

        </div>

    `;

}


/* =========================
   แปลง Status เป็นลำดับ
========================= */

function getStatusStep(status){

    status =
        String(status)
        .trim();


    if(status === "รับออเดอร์แล้ว"){
        return 0;
    }


    if(status === "กำลังทำ"){
        return 1;
    }


    /*
      รองรับข้อมูลเก่าที่อาจใช้
      "กำลังทำอาหาร"
    */

    if(status === "กำลังทำอาหาร"){
        return 1;
    }


    if(status === "พร้อมรับ"){
        return 2;
    }


    if(status === "เสร็จสิ้น"){
        return 3;
    }


    return 0;

}


/* =========================
   Status สี
========================= */

function getStatusClass(status){

    status =
        String(status)
        .trim();


    if(status === "รับออเดอร์แล้ว"){
        return "status-received";
    }


    if(
        status === "กำลังทำ" ||
        status === "กำลังทำอาหาร"
    ){
        return "status-making";
    }


    if(status === "พร้อมรับ"){
        return "status-ready";
    }


    if(status === "เสร็จสิ้น"){
        return "status-done";
    }


    return "status-received";

}


/* =========================
   แสดงสินค้า
========================= */

function renderItem(item){

    const name =
        item.ProductName ||
        item.Name ||
        "สินค้า";


    const size =
        item.Size
        ? `ขนาด ${item.Size}`
        : "";


    const quantity =
        Number(item.Quantity || 0);


    const unitPrice =
        Number(item.UnitPrice || 0);


    const itemTotal =
        Number(
            item.ItemTotal ||
            unitPrice * quantity ||
            0
        );


    return `

        <div class="item">

            <div>

                <div class="item-name">
                    ${escapeHTML(name)}
                </div>

                <div class="item-detail">

                    ${escapeHTML(size)}

                    ${size && quantity ? " × " : ""}

                    ${
                        quantity
                        ? `จำนวน ${quantity}`
                        : ""
                    }

                </div>

                ${
                    item.Note
                    ? `
                    <div class="item-detail">
                        หมายเหตุ:
                        ${escapeHTML(item.Note)}
                    </div>
                    `
                    : ""
                }

            </div>


            <div class="item-price">

                ฿${formatMoney(itemTotal)}

            </div>

        </div>

    `;

}


/* =========================
   Format Money
========================= */

function formatMoney(value){

    const number =
        Number(value || 0);


    return number.toLocaleString(
        "th-TH",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================
   Format Date
========================= */

function formatDate(value){

    if(!value){
        return "-";
    }


    const date =
        new Date(value);


    if(isNaN(date.getTime())){

        return String(value);

    }


    return date.toLocaleString(
        "th-TH",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );

}


/* =========================
   ป้องกัน HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   ไปหน้า Menu
========================= */

function goMenu(){

    window.location.href =
        "Menu.html";

}


/* =========================
   Auto Refresh
========================= */

let refreshTimer;


window.onload = function(){

    if(!checkLogin()) return;


    loadOrders();


    /*
      ตรวจสอบสถานะใหม่ทุก 10 วินาที
    */

    refreshTimer =
        setInterval(
            loadOrders,
            10000
        );

};


window.onbeforeunload = function(){

    if(refreshTimer){

        clearInterval(refreshTimer);

    }

};

</script>

</body>
</html>
